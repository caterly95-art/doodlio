<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Doodlio — Online Multiplayer Drawing & Guessing Game">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doodlio">
  <meta name="theme-color" content="#FF7A30">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Doodlio — Online Multiplayer Drawing &amp; Guessing Game</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0C10;
      color: #F5F5F7;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #0B0C10;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #1E2129;
      border-top: 4px solid #FF7A30;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-text {
      margin-top: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 18px;
      color: #FF7A30;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">DOODLIO</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
