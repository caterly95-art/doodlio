name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Doodlio Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter --version

      - name: Restore or Ensure google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
            echo "Decoded google-services.json from GitHub Secrets"
          elif [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already present in android/app/"
          else
            echo "Warning: google-services.json not found, build may fail if Firebase plugin requires it."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodlio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

